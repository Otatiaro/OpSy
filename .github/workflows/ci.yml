name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Force Node.js 24 for any JavaScript actions that still ship with a
# Node.js 20 manifest. Node.js 20 is deprecated on GitHub Actions and
# scheduled for removal in September 2026.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    name: Build (${{ matrix.compiler }} / cortex-${{ matrix.target }} / c++${{ matrix.standard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        target: [m3, m4, m7, m33]
        # C++26 is built alongside C++23 deliberately: OpSy targets 23, and
        # building 26 as it lands catches anything the newer standard changes
        # or removes before a user on a newer toolchain hits it.
        standard: [23, 26]
    steps:
      - uses: actions/checkout@v5

      - name: Install GCC ARM toolchain
        if: matrix.compiler == 'gcc'
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '14.3.Rel1'

      - name: Install LLVM Embedded Toolchain for Arm
        if: matrix.compiler == 'clang'
        uses: stellar-aria/llvm-embedded-toolchain-for-arm-action@latest
        # 19.1.1 is the latest version the action knows about. 19.1.5 exists
        # upstream but the action's release table hasn't been bumped to
        # include it yet. 19.1.1 is the same toolchain family — fine for
        # a compile-only sanity check.
        with:
          release: '19.1.1'

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure
        run: >
          cmake -S tests -B build
          -G Ninja
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/tests/cortex-m-toolchain.cmake
          -DOPSY_COMPILER=${{ matrix.compiler }}
          -DOPSY_TARGET=${{ matrix.target }}
          -DOPSY_CXX_STANDARD=${{ matrix.standard }}

      - name: Build
        run: cmake --build build --parallel

  host-tests:
    name: Host tests (${{ matrix.compiler }} / c++${{ matrix.standard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        standard: [23, 26]
    steps:
      - uses: actions/checkout@v5

      # The host suite builds 32-bit: utility/allocator.hpp requires
      # sizeof(int) == sizeof(void*), which holds on every Cortex-M target and
      # on no 64-bit host, and a 32-bit build keeps the pointer arithmetic
      # under test the same width as on target.
      - name: Install Ninja and 32-bit support
        run: sudo apt-get update && sudo apt-get install -y ninja-build gcc-multilib g++-multilib

      - name: Configure
        run: >
          cmake -S tests/host -B build-host
          -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}
          -DOPSY_CXX_STANDARD=${{ matrix.standard }}

      - name: Build
        run: cmake --build build-host --parallel

      - name: Run
        run: ctest --test-dir build-host --output-on-failure

  qemu-tests:
    name: QEMU tests (cortex-${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [m3, m4, m7, m33]
    steps:
      - uses: actions/checkout@v5

      - name: Install GCC ARM toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '14.3.Rel1'

      - name: Install Ninja and QEMU
        run: sudo apt-get update && sudo apt-get install -y ninja-build qemu-system-arm

      - name: Configure
        run: >
          cmake -S tests/qemu -B build-qemu
          -G Ninja
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/tests/cortex-m-toolchain.cmake
          -DOPSY_COMPILER=gcc
          -DOPSY_TARGET=${{ matrix.target }}

      - name: Build
        run: cmake --build build-qemu --parallel

      - name: Run
        run: ctest --test-dir build-qemu --output-on-failure
