name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Force Node.js 24 for any JavaScript actions that still ship with a
# Node.js 20 manifest. Node.js 20 is deprecated on GitHub Actions and
# scheduled for removal in September 2026.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

# One compiler, GCC 16, from Otatiaro/arm-none-eabi-toolchain (see
# .github/actions/arm-none-eabi-toolchain): what OpSy is written for, and
# what the C++26 work needs. clang comes back when it has contracts.
jobs:
  build:
    name: Build (cortex-${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [m3, m4, m7, m33]
    steps:
      - uses: actions/checkout@v5

      - name: Install the arm-none-eabi toolchain
        uses: ./.github/actions/arm-none-eabi-toolchain

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure
        run: >
          cmake -S tests -B build
          -G Ninja
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/tests/cortex-m-toolchain.cmake
          -DOPSY_COMPILER=gcc
          -DOPSY_TARGET=${{ matrix.target }}

      - name: Build
        run: cmake --build build --parallel

      # Not just a build: this project also carries the check that the
      # standalone directories really are standalone, which needs no image and
      # so lives with the compile-only build.
      - name: Check
        run: ctest --test-dir build --output-on-failure

  host-tests:
    name: Host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The host suite builds 32-bit: utility/allocator.hpp requires
      # sizeof(int) == sizeof(void*), which holds on every Cortex-M target and
      # on no 64-bit host, and a 32-bit build keeps the pointer arithmetic
      # under test the same width as on target.
      # g++-16 explicitly: the same major as the target compiler, so a header
      # that uses the C++26 library builds here too. It is Ubuntu 26.04's
      # package, a GCC 16 snapshot, not the runner's default GCC 15.
      - name: Install Ninja, 32-bit support and GCC 16
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++-16 g++-16-multilib

      - name: Configure
        run: >
          cmake -S tests/host -B build-host
          -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=g++-16

      - name: Build
        run: cmake --build build-host --parallel

      - name: Run
        run: ctest --test-dir build-host --output-on-failure

  qemu-tests:
    name: QEMU and GDB tests (cortex-${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [m3, m4, m7, m33]
    steps:
      - uses: actions/checkout@v5

      - name: Install the arm-none-eabi toolchain
        uses: ./.github/actions/arm-none-eabi-toolchain

      # The toolchain ships no GDB; the debugger-driven scenarios take the
      # system's gdb-multiarch, which reads the image's architecture itself.
      - name: Install Ninja, QEMU and GDB
        run: sudo apt-get update && sudo apt-get install -y ninja-build qemu-system-arm gdb-multiarch

      - name: Configure
        run: >
          cmake -S tests/qemu -B build-qemu
          -G Ninja
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/tests/cortex-m-toolchain.cmake
          -DOPSY_COMPILER=gcc
          -DOPSY_TARGET=${{ matrix.target }}

      - name: Build
        run: cmake --build build-qemu --parallel

      - name: Run
        run: ctest --test-dir build-qemu --output-on-failure

  qemu-tests-optimised:
    name: QEMU tests (cortex-${{ matrix.target }}, ${{ matrix.config.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [m3, m4, m7, m33]
        # What these jobs look for is a defect that only exists once the
        # optimiser is allowed to reorder, cache, eliminate or inline across
        # translation units -- a missing volatile on a memory-mapped register,
        # a missing "memory" clobber on inline assembly, an assumption that a
        # naked function keeps its frame. -Os and -O3 + LTO sit at opposite
        # ends of what the optimiser will do; -Os and -O2 under NDEBUG are what
        # a project actually ships, asserts and all the code they guard gone.
        config:
          - name: "-Os"
            flags: -DOPSY_OPTIMISATION=-Os
          - name: "-Os + NDEBUG"
            flags: '"-DOPSY_OPTIMISATION=-Os;-DNDEBUG"'
          - name: "-O2 + NDEBUG"
            flags: '"-DOPSY_OPTIMISATION=-O2;-DNDEBUG"'
          - name: "-O3 + LTO"
            flags: -DOPSY_OPTIMISATION=-O3 -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON
    steps:
      - uses: actions/checkout@v5

      - name: Install the arm-none-eabi toolchain
        uses: ./.github/actions/arm-none-eabi-toolchain

      - name: Install Ninja and QEMU
        run: sudo apt-get update && sudo apt-get install -y ninja-build qemu-system-arm

      # The GDB scenarios do not run here, and register themselves out: they
      # stop the CPU at functions an optimised build has inlined away. The
      # on-target cases and the no-heap check have no such limit, and are
      # what these jobs are for.
      - name: Configure
        run: >
          cmake -S tests/qemu -B build-qemu-optimised
          -G Ninja
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/tests/cortex-m-toolchain.cmake
          -DOPSY_COMPILER=gcc
          -DOPSY_TARGET=${{ matrix.target }}
          ${{ matrix.config.flags }}

      - name: Build
        run: cmake --build build-qemu-optimised --parallel

      - name: Run
        run: ctest --test-dir build-qemu-optimised --output-on-failure

  bench:
    name: Bench (cortex-${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: m3,  machine: mps2-an385 }
          - { target: m4,  machine: mps2-an386 }
          - { target: m7,  machine: mps2-an500 }
          - { target: m33, machine: mps2-an505 }
    steps:
      - uses: actions/checkout@v5

      - name: Install the arm-none-eabi toolchain
        uses: ./.github/actions/arm-none-eabi-toolchain

      - name: Install Ninja and QEMU
        run: sudo apt-get update && sudo apt-get install -y ninja-build qemu-system-arm

      # The release configuration a project ships, which is what the baseline
      # was taken in. Instructions executed between the markers of each
      # scenario, per function, read out of QEMU's execution trace; the
      # medians are held against tests/qemu/bench/baseline-<target>.json and
      # a growth beyond 5 % fails the job. A drop beyond it is printed too:
      # the PR that earns it updates the baseline. See tests/qemu/bench.
      - name: Configure
        run: >
          cmake -S tests/qemu -B build-bench
          -G Ninja
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/tests/cortex-m-toolchain.cmake
          -DOPSY_COMPILER=gcc
          -DOPSY_TARGET=${{ matrix.target }}
          "-DOPSY_OPTIMISATION=-Os;-DNDEBUG"

      - name: Build
        run: cmake --build build-bench --target opsy_qemu_bench

      - name: Profile against the baseline
        run: >
          python3 tests/qemu/bench/profile.py
          --image build-bench/opsy_qemu_bench.elf
          --machine ${{ matrix.machine }}
          --baseline tests/qemu/bench/baseline-${{ matrix.target }}.json

  codegen-checks:
    name: Codegen checks (cortex-${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [m3, m4, m7, m33]
    steps:
      - uses: actions/checkout@v5

      - name: Install the arm-none-eabi toolchain
        uses: ./.github/actions/arm-none-eabi-toolchain

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      # Built at -O2 on purpose: the volatile-MMIO and stack-alignment
      # properties only mean anything once the optimiser is allowed to
      # reorder, cache and eliminate. The other suites build without -O.
      - name: Configure
        run: >
          cmake -S tests/codegen -B build-codegen
          -G Ninja
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/tests/cortex-m-toolchain.cmake
          -DOPSY_COMPILER=gcc
          -DOPSY_TARGET=${{ matrix.target }}

      - name: Build
        run: cmake --build build-codegen --parallel

      - name: Check
        run: ctest --test-dir build-codegen --output-on-failure
