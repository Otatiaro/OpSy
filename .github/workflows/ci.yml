name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Force Node.js 24 for any JavaScript actions that still ship with a
# Node.js 20 manifest. Node.js 20 is deprecated on GitHub Actions and
# scheduled for removal in September 2026.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    name: Build (${{ matrix.compiler }} / cortex-${{ matrix.target }} / c++${{ matrix.standard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        target: [m3, m4, m7, m33]
        # C++26 is built alongside C++23 deliberately: OpSy targets 23, and
        # building 26 as it lands catches anything the newer standard changes
        # or removes before a user on a newer toolchain hits it.
        standard: [23, 26]
    steps:
      - uses: actions/checkout@v5

      - name: Install GCC ARM toolchain
        if: matrix.compiler == 'gcc'
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '14.3.Rel1'

      # Installed straight from the upstream release rather than through an
      # action. The action that used to do this apt-installs libtinfo5, which
      # Ubuntu 24.04 no longer ships, so every clang job died before compiling
      # anything. Fetching the tarball also lifts the version cap the action
      # imposed (it only knew about 19.1.1).
      - name: Install LLVM Embedded Toolchain for Arm
        if: matrix.compiler == 'clang'
        env:
          LLVM_ET_ARM_VERSION: '19.1.5'
        run: |
          set -euo pipefail
          url="https://github.com/ARM-software/LLVM-embedded-toolchain-for-Arm/releases/download/release-${LLVM_ET_ARM_VERSION}/LLVM-ET-Arm-${LLVM_ET_ARM_VERSION}-Linux-x86_64.tar.xz"
          curl --fail --silent --show-error --location --retry 3 -o llvm-et-arm.tar.xz "$url"
          mkdir -p "$HOME/llvm-et-arm"
          tar -xJf llvm-et-arm.tar.xz -C "$HOME/llvm-et-arm" --strip-components=1
          # Some LLVM builds still look for libtinfo.so.5; 24.04 has .6 and the
          # ABI is compatible for what clang uses it for. Only if needed.
          if ! "$HOME/llvm-et-arm/bin/clang" --version >/dev/null 2>&1; then
            sudo ln -sf /lib/x86_64-linux-gnu/libtinfo.so.6 /lib/x86_64-linux-gnu/libtinfo.so.5
          fi
          "$HOME/llvm-et-arm/bin/clang" --version
          echo "$HOME/llvm-et-arm/bin" >> "$GITHUB_PATH"

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure
        run: >
          cmake -S tests -B build
          -G Ninja
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/tests/cortex-m-toolchain.cmake
          -DOPSY_COMPILER=${{ matrix.compiler }}
          -DOPSY_TARGET=${{ matrix.target }}
          -DOPSY_CXX_STANDARD=${{ matrix.standard }}

      - name: Build
        run: cmake --build build --parallel

      # Not just a build: this project also carries the check that the
      # standalone directories really are standalone, which needs no image and
      # so lives with the compile-only build.
      - name: Check
        run: ctest --test-dir build --output-on-failure

  host-tests:
    name: Host tests (${{ matrix.compiler }} / c++${{ matrix.standard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        standard: [23, 26]
    steps:
      - uses: actions/checkout@v5

      # The host suite builds 32-bit: utility/allocator.hpp requires
      # sizeof(int) == sizeof(void*), which holds on every Cortex-M target and
      # on no 64-bit host, and a 32-bit build keeps the pointer arithmetic
      # under test the same width as on target.
      # g++-14 explicitly: the runner's default GNU compiler does not know
      # c++26, so the c++26 axis failed at configure time with "the current
      # compiler GNU does not support this". clang on the runner is recent
      # enough as-is.
      - name: Install Ninja, 32-bit support and GCC 14
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build gcc-multilib g++-multilib
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            sudo apt-get install -y g++-14 gcc-14 g++-14-multilib gcc-14-multilib
          fi

      - name: Configure
        run: >
          cmake -S tests/host -B build-host
          -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler == 'gcc' && 'g++-14' || 'clang++' }}
          -DOPSY_CXX_STANDARD=${{ matrix.standard }}

      - name: Build
        run: cmake --build build-host --parallel

      - name: Run
        run: ctest --test-dir build-host --output-on-failure

  qemu-tests:
    name: QEMU and GDB tests (${{ matrix.compiler }} / cortex-${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        target: [m3, m4, m7, m33]
    steps:
      - uses: actions/checkout@v5

      # Installed for both compilers: the clang jobs still need
      # arm-none-eabi-gdb, which the debugger-driven scenarios drive, and
      # arm-none-eabi-nm, which the no-heap check reads the image with.
      # Neither cares which compiler produced the image.
      - name: Install GCC ARM toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '14.3.Rel1'

      - name: Install LLVM Embedded Toolchain for Arm
        if: matrix.compiler == 'clang'
        env:
          LLVM_ET_ARM_VERSION: '19.1.5'
        run: |
          set -euo pipefail
          url="https://github.com/ARM-software/LLVM-embedded-toolchain-for-Arm/releases/download/release-${LLVM_ET_ARM_VERSION}/LLVM-ET-Arm-${LLVM_ET_ARM_VERSION}-Linux-x86_64.tar.xz"
          curl --fail --silent --show-error --location --retry 3 -o llvm-et-arm.tar.xz "$url"
          mkdir -p "$HOME/llvm-et-arm"
          tar -xJf llvm-et-arm.tar.xz -C "$HOME/llvm-et-arm" --strip-components=1
          if ! "$HOME/llvm-et-arm/bin/clang" --version >/dev/null 2>&1; then
            sudo ln -sf /lib/x86_64-linux-gnu/libtinfo.so.6 /lib/x86_64-linux-gnu/libtinfo.so.5
          fi
          echo "$HOME/llvm-et-arm/bin" >> "$GITHUB_PATH"

      - name: Install Ninja and QEMU
        run: sudo apt-get update && sudo apt-get install -y ninja-build qemu-system-arm

      - name: Configure
        run: >
          cmake -S tests/qemu -B build-qemu
          -G Ninja
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/tests/cortex-m-toolchain.cmake
          -DOPSY_COMPILER=${{ matrix.compiler }}
          -DOPSY_TARGET=${{ matrix.target }}

      - name: Build
        run: cmake --build build-qemu --parallel

      - name: Run
        run: ctest --test-dir build-qemu --output-on-failure

  qemu-tests-optimised:
    name: QEMU tests (${{ matrix.compiler }} / cortex-${{ matrix.target }}, ${{ matrix.config.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc]
        target: [m3, m4, m7, m33]
        # Two configurations rather than every -O level: what these jobs look
        # for is a defect that only exists once the optimiser is allowed to
        # reorder, cache, eliminate or inline across translation units -- a
        # missing volatile on a memory-mapped register, a missing "memory"
        # clobber on inline assembly, an assumption that a naked function
        # keeps its frame. -Os and -O3 sit at opposite ends of what the
        # optimiser will do, and LTO adds the cross-TU dimension neither has
        # on its own, so -O2 in the middle is bracketed by the two.
        config:
          - name: "-Os"
            flags: -DOPSY_OPTIMISATION=-Os
          - name: "-O3 + LTO"
            flags: -DOPSY_OPTIMISATION=-O3 -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON
        # clang on two cores rather than four. What is under test here is the
        # optimiser, not the core, and every core is already covered under
        # both compilers by the unoptimised jobs; m4 and m33 are one ARMv7-M
        # and one ARMv8-M, which is the difference that could still matter.
        include:
          - compiler: clang
            target: m4
            config: { name: "-Os", flags: -DOPSY_OPTIMISATION=-Os }
          - compiler: clang
            target: m4
            config: { name: "-O3 + LTO", flags: -DOPSY_OPTIMISATION=-O3 -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON }
          - compiler: clang
            target: m33
            config: { name: "-Os", flags: -DOPSY_OPTIMISATION=-Os }
          - compiler: clang
            target: m33
            config: { name: "-O3 + LTO", flags: -DOPSY_OPTIMISATION=-O3 -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON }
    steps:
      - uses: actions/checkout@v5

      # arm-none-eabi-nm is what the no-heap check reads the image with, so
      # the GNU toolchain is installed for the clang jobs too.
      - name: Install GCC ARM toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '14.3.Rel1'

      - name: Install LLVM Embedded Toolchain for Arm
        if: matrix.compiler == 'clang'
        env:
          LLVM_ET_ARM_VERSION: '19.1.5'
        run: |
          set -euo pipefail
          url="https://github.com/ARM-software/LLVM-embedded-toolchain-for-Arm/releases/download/release-${LLVM_ET_ARM_VERSION}/LLVM-ET-Arm-${LLVM_ET_ARM_VERSION}-Linux-x86_64.tar.xz"
          curl --fail --silent --show-error --location --retry 3 -o llvm-et-arm.tar.xz "$url"
          mkdir -p "$HOME/llvm-et-arm"
          tar -xJf llvm-et-arm.tar.xz -C "$HOME/llvm-et-arm" --strip-components=1
          if ! "$HOME/llvm-et-arm/bin/clang" --version >/dev/null 2>&1; then
            sudo ln -sf /lib/x86_64-linux-gnu/libtinfo.so.6 /lib/x86_64-linux-gnu/libtinfo.so.5
          fi
          echo "$HOME/llvm-et-arm/bin" >> "$GITHUB_PATH"

      - name: Install Ninja and QEMU
        run: sudo apt-get update && sudo apt-get install -y ninja-build qemu-system-arm

      # The GDB scenarios do not run here, and register themselves out: they
      # stop the CPU at functions an optimised build has inlined away. The
      # on-target cases and the no-heap check have no such limit, and are
      # what these jobs are for.
      - name: Configure
        run: >
          cmake -S tests/qemu -B build-qemu-optimised
          -G Ninja
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/tests/cortex-m-toolchain.cmake
          -DOPSY_COMPILER=${{ matrix.compiler }}
          -DOPSY_TARGET=${{ matrix.target }}
          ${{ matrix.config.flags }}

      - name: Build
        run: cmake --build build-qemu-optimised --parallel

      - name: Run
        run: ctest --test-dir build-qemu-optimised --output-on-failure

  codegen-checks:
    name: Codegen checks (cortex-${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [m3, m4, m7, m33]
    steps:
      - uses: actions/checkout@v5

      - name: Install GCC ARM toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '14.3.Rel1'

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      # Built at -O2 on purpose: the volatile-MMIO and stack-alignment
      # properties only mean anything once the optimiser is allowed to
      # reorder, cache and eliminate. The other suites build without -O.
      - name: Configure
        run: >
          cmake -S tests/codegen -B build-codegen
          -G Ninja
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/tests/cortex-m-toolchain.cmake
          -DOPSY_COMPILER=gcc
          -DOPSY_TARGET=${{ matrix.target }}

      - name: Build
        run: cmake --build build-codegen --parallel

      - name: Check
        run: ctest --test-dir build-codegen --output-on-failure
